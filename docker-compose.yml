version: '3.8'

services:
  scoreboard:
    build: .
    ports:
      - "5550:5000"
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
