<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CTF Scoreboard{% endblock %}</title>
    
    <!-- Tailwind CSS and DaisyUI from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Custom animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        .trophy-gold { color: #FFD700; }
        .trophy-silver { color: #C0C0C0; }
        .trophy-bronze { color: #CD7F32; }
        
        /* Smooth transitions */
        .score-item {
            transition: all 0.3s ease;
        }
        
        .score-item:hover {
            transform: translateX(5px);
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-base-200 min-h-screen">
    <!-- Navbar -->
    <div class="navbar bg-base-100 shadow-lg sticky top-0 z-50">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl">
                <i class="fas fa-trophy text-primary"></i>
                <span class="ml-2">{% block navbar_title %}CTF Scoreboard{% endblock %}</span>
            </a>
        </div>
        <div class="flex-none">
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
                    <i class="fas fa-ellipsis-v"></i>
                </div>
                <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
                    <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="/health"><i class="fas fa-heart-pulse"></i> Health</a></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer footer-center p-10 bg-base-100 text-base-content mt-auto">
        <aside>
            <i class="fas fa-flag-checkered text-4xl text-primary"></i>
            <p class="font-bold">
                CTF Scoreboard
            </p> 
            <p>Real-time CTF competition standings</p>
        </aside>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
